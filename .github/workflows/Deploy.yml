name: JobLane Full Deployment

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend

# =========================
# FRONTEND BUILD
# =========================
jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies (legacy peer deps)
        run: |
          cd $FRONTEND_DIR
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd $FRONTEND_DIR
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

# =========================
# DEPLOY FRONTEND
# =========================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy frontend
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SERVER_PATH=/var/www/production/joblane
          else
            SERVER_PATH=/var/www/staging/joblane
          fi

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF
            mkdir -p $SERVER_PATH
            rm -rf $SERVER_PATH/dist_backup
            [ -d $SERVER_PATH/dist ] && mv $SERVER_PATH/dist $SERVER_PATH/dist_backup || true
          EOF

          scp -r dist ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$SERVER_PATH/

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "sudo systemctl reload nginx"

# =========================
# DEPLOY BACKEND
# =========================
  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy backend
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BACKEND_PATH=/var/www/production/joblane-backend
          else
            BACKEND_PATH=/var/www/staging/joblane-backend
          fi

          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF
            mkdir -p $BACKEND_PATH
            cd $BACKEND_PATH

            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            else
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            fi

            cd backend
            npm install
            npm run build || true

            pm2 restart joblane-backend || pm2 start npm --name joblane-backend -- start
          EOF
