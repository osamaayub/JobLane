name: HubHive Deployment

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  # ===================
  # JOB 1: Build in GitHub Actions
  # ===================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4   # ✅ updated to v4
        with:
          name: dist
          path: dist

  # ===================
  # JOB 2: Deploy to Server
  # ===================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4  # ✅ updated to v4
        with:
          name: dist
          path: dist

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "ENV=$ENV" >> $GITHUB_OUTPUT

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy dist to server
        run: |
          ENV="${{ steps.env.outputs.ENV }}"

          # Set server path based on environment
          if [ "$ENV" == "production" ]; then
            SERVER_PATH=/var/www/production/equigenix-judge-testing-fe
          elif [ "$ENV" == "staging" ]; then
            SERVER_PATH=/var/www/staging/equigenix-judge-testing-fe
          else
            SERVER_PATH=/var/www/dev/equigenix-judge-testing-fe
          fi

          echo "Deploying $ENV to $SERVER_PATH"

          # Backup current dist folder
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            if [ -d $SERVER_PATH/dist ]; then
              rm -rf $SERVER_PATH/dist_backup
              mv $SERVER_PATH/dist $SERVER_PATH/dist_backup
              echo '✅ Backup created at dist_backup'
            fi
          "

          # Copy new dist to server
          scp -r dist/* ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:$SERVER_PATH/dist

          # Reload Nginx
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "sudo systemctl reload nginx"

          echo "✅ Deployment completed successfully!"
